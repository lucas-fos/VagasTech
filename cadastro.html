
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | VagasTech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-content">
        <a href="index.html" class="logo">Vagas<span>Tech</span></a>
        <a href="login.html">Já tenho conta</a>
    </div>
</header>

<main class="section">
    <div class="container">
        <div class="section-title">
            <h1>Faça parte da VagasTech</h1>
            <p>Escolha como deseja participar da plataforma.</p>
        </div>

        <div class="grid-2">
            <form class="form-card" id="candidate-register">
                <h2>Cadastro de candidato</h2>

                <div class="form-group">
                    <label>Nome completo</label>
                    <input name="name" required>
                </div>

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" name="phone" placeholder="(21) 99999-9999" maxlength="20" autocomplete="tel" required>
                    <small>Informe o número com DDD para que as empresas possam entrar em contato.</small>
                </div>

                <div class="form-group">
                    <label>Área de interesse</label>
                    <select name="area" required>
                        <option value="Frontend">Desenvolvimento Frontend</option>
                        <option value="Backend">Desenvolvimento Backend</option>
                        <option value="Banco de Dados">Banco de Dados</option>
                        <option value="Suporte">Suporte de TI</option>
                        <option value="Dados">Ciência de Dados</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nível atual</label>
                    <select name="level" required>
                        <option>Estudante</option>
                        <option>Estágio</option>
                        <option>Trainee</option>
                        <option>Júnior</option>
                    </select>
                </div>

                <button class="btn btn-accent">Cadastrar candidato</button>
            </form>

            <form class="form-card" id="company-register">
                <h2>Cadastro de empresa</h2>

                <div class="form-group">
                    <label>Nome da empresa</label>
                    <input name="name" required>
                </div>

                <div class="form-group">
                    <label>CNPJ</label>
                    <input name="cnpj" required>
                </div>

                <div class="form-group">
                    <label>E-mail corporativo</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label>Ramo de atuação</label>
                    <input name="sector" required>
                </div>

                <div class="form-group">
                    <label>Porte</label>
                    <select name="size">
                        <option>Pequena</option>
                        <option>Média</option>
                        <option>Grande</option>
                    </select>
                </div>

                <button class="btn btn-primary">Cadastrar empresa</button>
            </form>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
</body>
</html>
