
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar vagas | VagasTech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-content">
        <a href="index.html" class="logo">Vagas<span>Tech</span></a>
        <nav class="nav-links">
            <a href="dashboard.html">Painel</a>
            <a href="vagas.html">Vagas</a>
            <a href="perfil.html">Currículo</a>
            <a href="academy.html">Academy</a>
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <h1>Encontre sua próxima oportunidade</h1>
        <p>Vagas que valorizam conhecimentos e projetos de iniciantes.</p>
    </div>

    <section class="card" style="margin-bottom:25px">
        <div class="form-row">
            <div class="form-group">
                <label>Pesquisar</label>
                <input id="job-search" class="search-input"
                    placeholder="Cargo, empresa ou tecnologia">
            </div>

            <div class="form-group">
                <label>Nível</label>
                <select id="job-level">
                    <option value="">Todos os níveis</option>
                    <option>Estágio</option>
                    <option>Trainee</option>
                    <option>Júnior</option>
                </select>
            </div>

            <div class="form-group">
                <label>Modelo</label>
                <select id="job-model">
                    <option value="">Todos os modelos</option>
                    <option>Remoto</option>
                    <option>Híbrido</option>
                    <option>Presencial</option>
                </select>
            </div>
        </div>
    </section>

    <section id="jobs-list"></section>
</main>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
</body>
</html>
