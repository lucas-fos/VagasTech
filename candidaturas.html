
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas candidaturas | VagasTech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-content">
        <a href="index.html" class="logo">Vagas<span>Tech</span></a>
        <nav class="nav-links">
            <a href="dashboard.html">Painel</a>
            <a href="vagas.html">Vagas</a>
            <a href="candidaturas.html">Minhas candidaturas</a>
            <a href="perfil.html">Currículo</a>
            <a href="publicar-vaga.html">Publicar vaga</a>
            <a href="empresa-perfil.html">Banco de talentos</a>
            <a href="#" onclick="logout(); return false;">Sair</a>
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <h1 id="applications-page-title">Minhas candidaturas</h1>
        <p id="applications-page-description">Acompanhe o andamento das suas inscrições.</p>
    </div>

    <section id="applications-list"></section>
</main>

<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("vt_user") || "null");
    if (!user) {
        window.location.replace("login.html");
        return;
    }
    if (user.type === "company") {
        document.querySelector("#applications-page-title").textContent = "Candidaturas recebidas";
        document.querySelector("#applications-page-description").textContent =
            "Acompanhe os candidatos inscritos nas oportunidades da sua empresa.";
    }
});
</script>
<script src="js/api.js"></script>
</body>
</html>
